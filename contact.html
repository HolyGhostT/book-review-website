<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact BookReview</title><link rel="stylesheet" href="/styles.css"><style>.contact-wrap{max-width:680px;margin:55px auto;padding:24px}.contact-card{background:#fff;border:1px solid #e1e5dc;border-radius:16px;padding:28px}.contact-card label{display:block;margin-top:12px}.contact-card input,.contact-card textarea{width:100%;padding:12px;border:1px solid #ccd5ce;border-radius:8px;font:inherit;margin-top:6px}.contact-card button{margin-top:15px;padding:12px 18px;cursor:pointer}.status{margin-top:12px}</style></head><body><main class="contact-wrap"><p><a href="/">← Back to BookReview</a></p><section class="contact-card"><h1>Contact BookReview</h1><p>Send a message to the website team.</p><form id="contactForm"><label>Name</label><input name="name" maxlength="80" required><label>Email</label><input name="email" type="email" maxlength="160" required><label>Subject</label><input name="subject" maxlength="160" required><label>Message</label><textarea name="message" rows="6" minlength="5" maxlength="3000" required></textarea><button type="submit">Send message</button><p id="status" class="status" role="status"></p></form></section></main><script>
document.querySelector("#contactForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const payload=Object.fromEntries(f.entries());const s=document.querySelector("#status");s.textContent="Sending...";try{const r=await fetch("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||"Could not send message");s.textContent="Your message has been received. Thank you.";e.target.reset()}catch(err){s.textContent=err.message}});
</script></body></html>
